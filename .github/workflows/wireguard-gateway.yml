name: WireGuard Gateway via Tailscale

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Nom de la machine sur Tailscale"
        required: false
        default: "gh-runner-gateway"
      job_duration_minutes:
        description: "Durée de maintien active en minutes (max 350)"
        required: false
        default: "300"

jobs:
  tailscale-exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activer le transfert IP (IPv4 & IPv6)
        run: |
          echo "net.ipv4.ip_forward = 1" | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          echo "net.ipv6.conf.all.forwarding = 1" | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

      - name: Démarrer Tailscale en Exit Node
        uses: tailscale/github-action@v3
        with:
          authkey: "${{ secrets.TS_AUTHKEY }}"
          hostname: "${{ github.event.inputs.hostname }}"
          args: "--advertise-exit-node"

      - name: Afficher l'état Tailscale et l'IP publique de sortie
        run: |
          tailscale status
          tailscale ip -4 || true
          echo "IP publique de sortie du runner :"
          curl -4 -fsSL https://ifconfig.me || true

      - name: Maintenir le nœud actif
        env:
          INPUT_MIN: "${{ github.event.inputs.job_duration_minutes }}"
        run: |
          MINUTES="${INPUT_MIN:-300}"
          if [ "$MINUTES" -gt 350 ]; then
            MINUTES=350
          fi
          echo "Nœud Tailscale actif pendant ${MINUTES} minutes..."
          sleep $((MINUTES * 60))
