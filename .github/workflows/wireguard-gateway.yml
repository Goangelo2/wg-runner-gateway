name: WireGuard Gateway (Runner)

on:
  workflow_dispatch:
    inputs:
      endpoint_host:
        description: "IP ou domaine d'endpoint (laisser vide pour IP publique auto)"
        required: false
        default: ""
      listen_port:
        description: "Port UDP d'écoute WireGuard"
        required: false
        default: "51820"
      client_ip:
        description: "IP publique du client (pour nping)"
        required: false
        default: ""
      client_port:
        description: "Port UDP source du client (pour nping)"
        required: false
        default: ""
      job_duration_minutes:
        description: "Durée en minutes (max 350)"
        required: false
        default: "300"

jobs:
  wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les paquets
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wireguard-tools qrencode nmap iptables iproute2 curl

      - name: Activer le transfert IP
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

      - name: Générer les clés
        run: |
          mkdir -p wg-config
          umask 077
          wg genkey | tee wg-config/server_private.key | wg pubkey > wg-config/server_public.key
          wg genkey | tee wg-config/client_private.key | wg pubkey > wg-config/client_public.key

      - name: Détecter interface et IP publique
        id: net
        run: |
          IFACE=$(ip -4 route ls default | awk '/default/ {print $5; exit}')
          PUBLIC_IP=$(curl -4 -fsSL https://ifconfig.me || curl -4 -fsSL https://api.ipify.org || echo "127.0.0.1")
          echo "iface=${IFACE}" >> "$GITHUB_OUTPUT"
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"

      - name: Configurer et démarrer WireGuard
        env:
          IFACE: "${{ steps.net.outputs.iface }}"
          LISTEN_PORT: "${{ github.event.inputs.listen_port }}"
        run: |
          PORT="${LISTEN_PORT:-51820}"
          SERVER_PRIVATE=$(cat wg-config/server_private.key)
          CLIENT_PUBLIC=$(cat wg-config/client_public.key)

          cat > wg-config/wg0.conf <<EOF
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = ${PORT}
          PrivateKey = ${SERVER_PRIVATE}
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o ${IFACE} -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o ${IFACE} -j MASQUERADE

          [Peer]
          PublicKey = ${CLIENT_PUBLIC}
          AllowedIPs = 10.66.66.2/32
          EOF

          sudo install -m 600 wg-config/wg0.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo wg show

      - name: Générer client.conf et QR code
        env:
          ENDPOINT_HOST: "${{ github.event.inputs.endpoint_host }}"
          PUBLIC_IP: "${{ steps.net.outputs.public_ip }}"
          LISTEN_PORT: "${{ github.event.inputs.listen_port }}"
        run: |
          HOST="${ENDPOINT_HOST:-$PUBLIC_IP}"
          PORT="${LISTEN_PORT:-51820}"
          CLIENT_PRIVATE=$(cat wg-config/client_private.key)
          SERVER_PUBLIC=$(cat wg-config/server_public.key)

          cat > wg-config/client.conf <<EOF
          [Interface]
          PrivateKey = ${CLIENT_PRIVATE}
          Address = 10.66.66.2/32
          DNS = 1.1.1.1

          [Peer]
          PublicKey = ${SERVER_PUBLIC}
          Endpoint = ${HOST}:${PORT}
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

          cat wg-config/client.conf
          qrencode -t ansiutf8 < wg-config/client.conf

      - name: Percement NAT UDP (nping)
        env:
          CLIENT_IP: "${{ github.event.inputs.client_ip }}"
          CLIENT_PORT: "${{ github.event.inputs.client_port }}"
          LISTEN_PORT: "${{ github.event.inputs.listen_port }}"
          DURATION_MIN: "${{ github.event.inputs.job_duration_minutes }}"
        run: |
          if [ -z "$CLIENT_IP" ] || [ -z "$CLIENT_PORT" ]; then
            echo "client_ip ou client_port vide : nping ignoré."
            exit 0
          fi

          WG_PORT="${LISTEN_PORT:-51820}"
          MINUTES="${DURATION_MIN:-300}"
          if [ "$MINUTES" -gt 350 ]; then
            MINUTES=350
          fi

          END_TS=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END_TS" ]; do
            sudo nping --udp -g "$WG_PORT" -p "$CLIENT_PORT" -c 1 --delay 0 "$CLIENT_IP" >/dev/null 2>&1 || true
            sleep 25
          done &

      - name: Téléverser l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-client-config
          path: wg-config/client.conf
          retention-days: 1

      - name: Maintenir le tunnel actif
        env:
          DURATION_MIN: "${{ github.event.inputs.job_duration_minutes }}"
        run: |
          MINUTES="${DURATION_MIN:-300}"
          if [ "$MINUTES" -gt 350 ]; then
            MINUTES=350
          fi
          sleep $((MINUTES * 60))
