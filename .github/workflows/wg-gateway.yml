name: WireGuard Gateway

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Durée de maintien en minutes (5-350)"
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  wg-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Installer dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools curl wget tar iproute2

      - name: Installer wstunnel et cloudflared
        run: |
          set -e
          WSTUNNEL_VER="v10.1.5"
          wget -q "https://github.com/erebe/wstunnel/releases/download/${WSTUNNEL_VER}/wstunnel_${WSTUNNEL_VER#v}_linux_amd64.tar.gz"
          tar xzf wstunnel_*_linux_amd64.tar.gz
          chmod +x wstunnel
          sudo mv wstunnel /usr/local/bin/
          sudo chmod +x /usr/local/bin/wstunnel
          rm -f wstunnel_*_linux_amd64.tar.gz

          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Activer le forwarding IP
        run: sudo sysctl -w net.ipv4.ip_forward=1

      - name: Générer les clés WireGuard
        run: |
          umask 077
          wg genkey > server_private.key
          wg pubkey < server_private.key > server_public.key
          wg genkey > client_private.key
          wg pubkey < client_private.key > client_public.key
          echo "SERVER_PRIVATE=$(cat server_private.key)" >> $GITHUB_ENV
          echo "SERVER_PUBLIC=$(cat server_public.key)" >> $GITHUB_ENV
          echo "CLIENT_PRIVATE=$(cat client_private.key)" >> $GITHUB_ENV
          echo "CLIENT_PUBLIC=$(cat client_public.key)" >> $GITHUB_ENV

      - name: Configurer et démarrer WireGuard
        run: |
          sudo mkdir -p /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf > /dev/null <<EOF
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = 51820
          PrivateKey = ${{ env.SERVER_PRIVATE }}
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

          [Peer]
          PublicKey = ${{ env.CLIENT_PUBLIC }}
          AllowedIPs = 10.66.66.2/32
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Lancer wstunnel server
        run: |
          nohup bash -c 'wstunnel server ws://0.0.0.0:8080 --restrict-to 127.0.0.1:51820' > /tmp/wstunnel.log 2>&1 &
          sleep 3
          if ! ss -tlnp | grep -q ':8080'; then
            echo "ERREUR : wstunnel n'écoute pas sur le port 8080" >&2
            exit 1
          fi

      - name: Exposer via Cloudflare Tunnel
        id: cf
        run: |
          nohup bash -c 'cloudflared tunnel --url http://localhost:8080 --no-autoupdate' > /tmp/cloudflared.log 2>&1 &
          sleep 10
          URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
          if [ -z "$URL" ]; then
            echo "ERREUR : impossible de détecter l'URL Cloudflare" >&2
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "public_url=${URL}" >> $GITHUB_OUTPUT

      - name: Créer le fichier de configuration
        run: |
          mkdir -p output
          WSS_URL=$(echo "${{ steps.cf.outputs.public_url }}" | sed 's/https/wss/')
          
          cat > output/wg-github.conf <<EOF
          [Interface]
          PrivateKey = ${{ env.CLIENT_PRIVATE }}
          Address = 10.66.66.2/32
          DNS = 1.1.1.1

          [Peer]
          PublicKey = ${{ env.SERVER_PUBLIC }}
          Endpoint = 127.0.0.1:51821
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

          cat > output/commande-termux.txt <<EOF
          Copiez-collez cette commande dans Termux :
          
          ./wstunnel client -L "udp://51821:127.0.0.1:51820?timeout_sec=0" $WSS_URL
          EOF

      - name: Uploader l'artefact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Configuration-VPN
          path: output/

      - name: Maintenir le job actif
        run: |
          echo "Gateway actif pendant ${{ inputs.duration_minutes }} minutes."
          sleep $((${{ inputs.duration_minutes }} * 60))
